<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Members — Unscripted NITT</title>
  <meta name="description" content="Meet the members of Unscripted, the public speaking club of NIT Trichy." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="../icons/favicon.png" type="image/png" />
</head>
<body>

<nav class="navbar" id="navbar">
  <a class="nav-logo" href="../index.html"><img src="../icons/logo.png" alt="Unscripted NITT" /></a>
  <div class="nav-links" id="navLinks">
    <a href="../index.html#about">About</a>
    <a href="../index.html#events">Events</a>
    <a href="../index.html#gallery">Gallery</a>
    <a href="../index.html#contact">Contact</a>
    <a href="members.html" style="color:var(--orange);">Members</a>
    <a href="videos.html">Speeches</a>
  </div>
  <div class="nav-actions">
    <button class="btn-login" onclick="window.location.href='login.html'">Member Login</button>
    <button class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="page-header">
  <span class="section-tag">The Club</span>
  <h1>Meet the Team</h1>
  <p>The speakers, leaders, and mentors who make Unscripted what it is.</p>
</div>

<div class="page-content">
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" onclick="filterMembers('all',this)">All Members</button>
    <button class="filter-btn" onclick="filterMembers('core',this)">Core Team</button>
    <button class="filter-btn" onclick="filterMembers('mentor',this)">Mentors</button>
    <button class="filter-btn" onclick="filterMembers('member',this)">Members</button>
  </div>

  <!-- Search -->
  <div style="margin-bottom:2rem;">
    <input type="text" id="memberSearch" placeholder="Search by name or department..." style="max-width:380px;" oninput="searchMembers(this.value)" />
  </div>

  <div class="members-grid" id="membersGrid">
    <div class="event-skeleton" style="height:220px;"></div>
    <div class="event-skeleton" style="height:220px;"></div>
    <div class="event-skeleton" style="height:220px;"></div>
    <div class="event-skeleton" style="height:220px;"></div>
    <div class="event-skeleton" style="height:220px;"></div>
    <div class="event-skeleton" style="height:220px;"></div>
  </div>
</div>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-top">
      <div class="footer-brand">
        <div class="footer-logo"><img src="../icons/logo.png" alt="Unscripted" /></div>
        <p class="footer-tagline">Unscripted NITT</p>
      </div>
      <div class="footer-nav"><h4>Pages</h4><ul>
        <li><a href="../index.html#events">Events</a></li>
        <li><a href="../index.html#gallery">Gallery</a></li>
        <li><a href="../index.html#contact">Contact</a></li>
        <li><a href="members.html">Members</a></li>
        <li><a href="videos.html">Speeches</a></li>
      </ul></div>
    </div>
    <div class="footer-bottom">
      <p class="footer-copy">&copy; 2025 Unscripted, NIT Trichy.</p>
      <p class="footer-love">Made with <span>&hearts;</span> in Trichy</p>
    </div>
  </div>
</footer>

<script type="module">
import { db } from '../js/firebase-config.js';
import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const COLORS = ['#FF5722','#E64A19','#FF7043','#F4511E','#BF360C','#D84315'];
let allMembers = [];
let currentRole = 'all';

async function loadMembers() {
  try {
    const snap = await getDocs(query(collection(db,'members'), orderBy('name')));
    allMembers = [];
    snap.forEach(doc => {
      const d = doc.data();
      if (d.isActive !== false) allMembers.push({id:doc.id,...d});
    });
    if (!allMembers.length) {
      document.getElementById('membersGrid').innerHTML = '<p style="color:var(--text-light);text-align:center;grid-column:1/-1;padding:3rem;">Member list coming soon.</p>';
      return;
    }
    renderMembers(allMembers);
  } catch(e) {
    document.getElementById('membersGrid').innerHTML = '<p style="color:var(--text-light);text-align:center;grid-column:1/-1;padding:3rem;">Could not load members.</p>';
  }
}

function renderMembers(members) {
  const grid = document.getElementById('membersGrid');
  if (!members.length) {
    grid.innerHTML = '<p style="color:var(--text-light);text-align:center;grid-column:1/-1;padding:2rem;">No members found.</p>';
    return;
  }
  // Group by batch
  const batches = {};
  members.forEach((m,i) => {
    const batch = m.batch || 'Others';
    if (!batches[batch]) batches[batch] = [];
    batches[batch].push({...m, _idx: i});
  });
  // Sort batches descending
  const sortedBatches = Object.keys(batches).sort((a,b) => b.localeCompare(a));
  let html = '<div style="grid-column:1/-1;">';
  sortedBatches.forEach(batch => {
    const bMembers = batches[batch];
    html += `
      <div style="margin-bottom:1.5rem;">
        <button onclick="toggleBatch('batch_${batch.replace(/\s/g,'_')}')"
          style="display:flex;align-items:center;gap:0.75rem;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.85rem 1.25rem;cursor:pointer;font-weight:800;font-size:0.95rem;color:var(--text);text-align:left;margin-bottom:0.75rem;">
          <i class="fa-solid fa-chevron-down" id="icon_batch_${batch.replace(/\s/g,'_')}" style="color:var(--orange);font-size:0.75rem;transition:0.2s;"></i>
          Batch ${batch}
          <span style="margin-left:auto;font-size:0.75rem;font-weight:600;color:var(--text-light);">${bMembers.length} member${bMembers.length!==1?'s':''}</span>
        </button>
        <div id="batch_${batch.replace(/\s/g,'_')}" class="members-grid" style="display:grid;">
          ${bMembers.map((m,i) => {
            const initials = (m.name||'U').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
            const color = m.avatarColor || COLORS[m._idx % COLORS.length];
            const roleLabel = { core:'Core Team', mentor:'Mentor', admin:'Admin' }[m.role] || 'Member';
            const roleColor = m.role === 'core' || m.role === 'admin' ? 'var(--orange)' : 'var(--text-light)';
            const avatarContent = m.photoUrl ? `<img src="${m.photoUrl}" alt="${m.name||'Member'}" loading="lazy" />` : initials;
            return `<div class="member-card fade-up visible">
              <div class="avatar" style="background:${m.photoUrl?'transparent':color}">${avatarContent}</div>
              <h3>${m.name||'Member'}</h3>
              <div class="dept">${m.department||m.dept||''}${m.batch?' &middot; '+m.batch:''}</div>
              ${m.degree?'<div class="dept" style="font-size:0.72rem;">'+m.degree+'</div>':''}
              <div class="video-meta" style="color:${roleColor};margin-top:0.4rem;">${roleLabel}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  });
  html += '</div>';
  grid.innerHTML = html;
}

window.toggleBatch = function(id) {
  const el = document.getElementById(id);
  const icon = document.getElementById('icon_'+id);
  if (!el) return;
  const isHidden = el.style.display === 'none';
  el.style.display = isHidden ? 'grid' : 'none';
  if (icon) icon.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(-90deg)';
};

window.filterMembers = function(role, btn) {
  currentRole = role;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const search = document.getElementById('memberSearch').value.toLowerCase();
  applyFilters(search);
};

window.searchMembers = function(val) {
  applyFilters(val.toLowerCase());
};

function applyFilters(search) {
  let filtered = currentRole === 'all' ? allMembers : allMembers.filter(m=>m.role===currentRole);
  if (search) filtered = filtered.filter(m=>(m.name||'').toLowerCase().includes(search)||(m.dept||m.department||'').toLowerCase().includes(search));
  renderMembers(filtered);
}

loadMembers();
</script>
<script type="module" src="../js/nav.js"></script>
</body>
</html>
